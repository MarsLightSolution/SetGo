<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Meta Tags -->
    <title>Satgo - Buy & Sell Locally | Marketplace for Everyone</title>
    <meta name="title" content="Satgo - Buy & Sell Locally | Marketplace for Everyone" />
    <meta name="description" content="Satgo is your trusted local marketplace. Buy and sell products easily, discover nearby shops, and connect with your community. Join thousands of users trading safely and conveniently." />
    <meta name="keywords" content="marketplace, buy, sell, local marketplace, online shopping, e-commerce, Satgo, classified ads, second hand, nearby products" />
    <meta name="author" content="Satgo" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL - Update this with your production URL -->
    <link rel="canonical" href="https://tiwari.shop" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tiwari.shop" />
    <meta property="og:title" content="Satgo - Buy & Sell Locally | Marketplace for Everyone" />
    <meta property="og:description" content="Satgo is your trusted local marketplace. Buy and sell products easily, discover nearby shops, and connect with your community." />
    <meta property="og:image" content="https://tiwari.shop/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Satgo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tiwari.shop" />
    <meta name="twitter:title" content="Satgo - Buy & Sell Locally" />
    <meta name="twitter:description" content="Satgo is your trusted local marketplace. Buy and sell products easily, discover nearby shops, and connect with your community." />
    <meta name="twitter:image" content="https://tiwari.shop/og-image.jpg" />

    <!-- Theme Color (for mobile browsers) -->
    <meta name="theme-color" content="#10b981" />
    <meta name="msapplication-TileColor" content="#10b981" />

    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- CSP: Commented out for local development. Enable for production with HTTPS -->
    <!-- <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" /> -->

    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Structured Data / JSON-LD for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Satgo",
      "url": "https://tiwari.shop",
      "description": "Local marketplace for buying and selling products",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://tiwari.shop/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
