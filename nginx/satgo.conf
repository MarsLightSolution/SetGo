# =============================================================================
#  SetGo — Nginx Configuration
#  Domain  : satgo.az
#  Frontend: /home/ubuntu/SetGo/Frontend/dist  (static)
#  Backend : localhost:8080
#  Payment : localhost:5001
#
#  This file mirrors what is actually deployed at
#  /etc/nginx/sites-available/satgo.conf on the production server
#  (synced 2026-09-11 — SSL is already live via Certbot for all three
#  domains, auto-renewed by the certbot systemd timer).
#
#  FIRST-TIME SETUP on a fresh server (HTTP only, before certificates exist):
#    1. Comment out (or remove) every "listen 443 ssl ..." block below,
#       the trailing "server { if ($host = ...) ... }" redirect blocks,
#       and change the three "listen 80; ... return 404;" blocks back to
#       plain "location / { ... proxy_pass / try_files ... }" server blocks
#       (see git history before 2026-09 for the original HTTP-only version).
#    2. sudo cp nginx/satgo.conf /etc/nginx/sites-available/satgo.conf
#       sudo ln -s /etc/nginx/sites-available/satgo.conf /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default
#       sudo nginx -t && sudo systemctl reload nginx
#    3. Add SSL:
#       sudo apt install certbot python3-certbot-nginx -y
#       sudo certbot --nginx -d satgo.az -d www.satgo.az -d api.satgo.az -d payment.satgo.az
#       (certbot rewrites this file in place on the server to add the SSL
#       blocks you see below — if you do this again, copy the result back
#       into this repo file so it doesn't drift again.)
# =============================================================================

# ─── Upstream services ───────────────────────────────────────────────────────
upstream backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream payment {
    server 127.0.0.1:5001;
    keepalive 16;
}

# ─── Rate limiting zones ─────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;

# =============================================================================
#  FRONTEND — satgo.az / www.satgo.az
# =============================================================================
server {
    server_name satgo.az www.satgo.az;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;

    root  /home/ubuntu/SetGo/Frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Cache hashed assets forever (Vite adds content hash to filenames)
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache images / fonts
    location ~* \.(ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # React SPA — send everything to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/satgo.az/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/satgo.az/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# =============================================================================
#  BACKEND API — api.satgo.az  →  localhost:8080
# =============================================================================
server {
    server_name api.satgo.az;

    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;

    # Max upload size (profile pics, product images)
    client_max_body_size 50m;

    # ── WebSocket support (Socket.io) ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Static uploads ───────────────────────────────────────────────────────
    location /uploads/ {
        alias /home/ubuntu/SetGo/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── All API traffic ──────────────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffer_size        16k;
        proxy_buffers            8 32k;
        proxy_busy_buffers_size  64k;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/satgo.az/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/satgo.az/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# =============================================================================
#  PAYMENT MICROSERVICE — payment.satgo.az  →  localhost:5001
# =============================================================================
server {
    server_name payment.satgo.az;

    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;

    location / {
        limit_req zone=payment_limit burst=5 nodelay;

        proxy_pass         http://payment;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/satgo.az/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/satgo.az/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.satgo.az) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = satgo.az) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name satgo.az www.satgo.az;
    return 404; # managed by Certbot

}
server {
    if ($host = api.satgo.az) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.satgo.az;
    return 404; # managed by Certbot

}
server {
    if ($host = payment.satgo.az) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name payment.satgo.az;
    return 404; # managed by Certbot

}
