# Usage:
#   docker compose build
#   docker compose up -d
#
# Secrets are NOT baked into images. They come from the gitignored file
#   backend/.env
services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_SERVER: ${VITE_SERVER:-https://api.satgo.az}
        VITE_FRONTEND: ${VITE_FRONTEND:-https://satgo.az}
        VITE_SOCKET: ${VITE_SOCKET:-https://api.satgo.az}
        VITE_APP_URL: ${VITE_APP_URL:-https://satgo.az}
        VITE_GOOGLE_MAPS_KEY: ${VITE_GOOGLE_MAPS_KEY:-}
    image: setgo-frontend
    ports:
      - "8081:80"
    restart: unless-stopped

  backend:
    build: ./backend
    image: setgo-backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_logs:
